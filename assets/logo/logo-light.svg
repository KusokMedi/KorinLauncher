<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360">
  <title>Korin Launcher — logo (light)</title>
  <desc>Korin Launcher lockup: app mark and wordmark (light background variant)</desc>
  <defs>
    <linearGradient id="armShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111114"/>
      <stop offset="1" stop-color="#5C5C66"/>
    </linearGradient>
  </defs>

  <g transform="translate(48 40) scale(0.55)">
    <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="#F7F7F8"/>
    <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="none" stroke="#D6D6DC" stroke-width="6"/>
    <path d="M 172 130 L 172 382" fill="none" stroke="#111114" stroke-width="56"
