    <path d="M 196 256 L 344 378" fill="none" stroke="url(#armShade)" stroke-width="52"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="400" y="232" font-family="'Noto Sans','Liberation Sans',sans-serif"
        font-weight="700" font-size="124" letter-spacing="-2">
    <tspan fill="#FAFAFC">Korin</tspan><tspan fill="#9A9AA6" dx="28">Launcher</tspan>
  </text>
</svg>
