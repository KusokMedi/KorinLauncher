<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Korin Launcher (light)</title>
  <desc>Korin Launcher app icon for light backgrounds: stylized letter K</desc>
  <defs>
    <linearGradient id="armShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111114"/>
      <stop offset="1" stop-color="#5C5C66"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="#F7F7F8"/>
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="none" stroke="#D6D6DC" stroke-width="6"/>

  <!-- K: stem -->
  <path d="M 172 130 L 172 382" fill="none" stroke="#111114" stroke-width="56"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- K: arms -->
  <path d="M 196 256 L 344 134" fill="none" stroke="url(#armShade)" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 196 256 L 344 378" fill="none" stroke="url(#armShade)" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
