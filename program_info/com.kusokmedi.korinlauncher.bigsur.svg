<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Korin Launcher</title>
  <desc>Korin Launcher app icon: stylized letter K, black/gray/white</desc>
  <defs>
    <linearGradient id="armShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9B9C3"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="#0E0E10"/>
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="none" stroke="#2E2E35" stroke-width="6"/>

  <!-- K: stem -->
  <path d="M 172 130 L 172 382" fill="none" stroke="#FAFAFC" stroke-width="56"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- K: arms -->
  <path d="M 196 256 L 344 134" fill="none" stroke="url(#armShade)" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 196 256 L 344 378" fill="none" stroke="url(#armShade)" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
